<div class="row">
    <div class="col-sm">
        <h4>
            <em>
                Vida e mana
            </em>
        </h4>
    </div>
</div>
<div class="row text-center g-3">
    <!-- BLOCO DE VIDA -->
    <div class="col-lg-6 col-md-12">
        <h6 class="mb-1 text-uppercase small text-secondary">Barra de Vida</h6>
        <div class="row g-2 flex-nowrap">
            <!-- Vida Atual / Máxima -->
            <div class="col-9">
                <div class="barra_vida_mana d-flex flex-column justify-content-between p-1">
                    <div class="d-flex align-items-center flex-grow-1">
                        <div class="d-flex align-items-baseline w-100">
                            <input id="vida_atual" type="text"
                                   oninput="this.value = this.value.replace(/[^0-9]/g, '')"
                                   class="border-0 bg-transparent text-white text-center fs-4 lh-1 p-0"
                                   style="flex: 1; min-width: 0; outline: none;">
                            <span class="fs-4 lh-1 text-secondary">/</span>
                            <span id="vida_max" class="fs-4 lh-1 text-secondary text-center" style="flex: 1;">135</span>
                        </div>
                    </div>
                    <div class="progress" style="height: 5px;">
                        <div id="barra_vida" class="progress-bar bg-success" style="width: 0%;"></div>
                    </div>
                </div>
                <div class="d-flex mt-1">
                    <small class="text-secondary w-50 text-center" style="font-size: 0.75rem;">Atual</small>
                    <small class="text-secondary w-50 text-center" style="font-size: 0.75rem;">Máximo</small>
                </div>
            </div>

            <!-- Vida Temporária -->
            <div class="col-3">
                <div class="barra_vida_mana d-flex align-items-center justify-content-center p-1">
                    <input id="vida_temp" type="text"
                           oninput="this.value = this.value.replace(/[^0-9]/g, '')"
                           class="w-100 border-0 bg-transparent text-white text-center fs-4 lh-1 p-0"
                           style="outline: none;">
                </div>
                <div class="mt-1">
                    <small class="text-secondary" style="font-size: 0.75rem;">Temporário</small>
                </div>
            </div>
        </div>
    </div>

    <!-- BLOCO DE MANA -->
    <div class="col-lg-6 col-md-12">
        <h6 class="mb-1 text-uppercase small text-secondary">Barra de Mana</h6>
        <div class="row g-2">
            <!-- Mana Atual / Máxima -->
            <div class="col-12">
                <div class="barra_vida_mana d-flex flex-column justify-content-between p-1">
                    <div class="d-flex align-items-center flex-grow-1">
                        <div class="d-flex align-items-baseline w-100">
                            <input id="mana_atual" type="text"
                                   oninput="this.value = this.value.replace(/[^0-9]/g, '')"
                                   class="border-0 bg-transparent text-white text-center fs-4 lh-1 p-0"
                                   style="flex: 1; min-width: 0; outline: none;">
                            <span class="fs-4 lh-1 text-secondary">/</span>
                            <span id="mana_max" class="fs-4 lh-1 text-secondary text-center" style="flex: 1;">135</span>
                        </div>
                    </div>
                    <div class="progress" style="height: 5px;">
                        <div id="barra_mana" class="progress-bar bg-primary" style="width: 0%;"></div>
                    </div>
                </div>
                <div class="d-flex mt-1">
                    <small class="text-secondary w-50 text-center" style="font-size: 0.75rem;">Atual</small>
                    <small class="text-secondary w-50 text-center" style="font-size: 0.75rem;">Máximo</small>
                </div>
            </div>
        </div>
    </div>
</div>
<div class="row mt-2 align-items-center">
    <div class="col-3 col-xl-3 col-md-4 col-sm-3 col-xs-2">
        <h6 class="mb-0">Dados de Vida:</h6>
    </div>
    <div class="col-3 col-xl-3 col-md-4 col-sm-3 col-xs-2 barra_vida_mana">
        <div class="d-flex align-items-center justify-content-center h-100">
            <div class="d-flex align-items-baseline gap-2">
                <input id="dados_vida_atual" type="text"
                       oninput="this.value = this.value.replace(/[^0-9]/g, '')"
                       class="border-0 bg-transparent text-white text-center fs-4 lh-1 p-0"
                       style="width: 40px; outline: none;">
                <span class="fs-4 lh-1 text-secondary">/</span>
                <span id="dados_vida_max" class="fs-4 lh-1 text-secondary">20</span>
            </div>
        </div>
    </div>
</div>

<script>
    // Seleciona os elementos da tela pelos IDs
    const vidaAtual = document.getElementById('vida_atual');
    const spanVidaMaxima = document.getElementById('vida_max');
    const barra_vida = document.getElementById('barra_vida');

    // Cria um "escutador" que roda toda vez que algo for digitado no vida
    vidaAtual.addEventListener('blur', () => {
        // 1. Pega os textos, converte para número (Number) 
        let atual = Number(vidaAtual.value);
        let maximo = Number(spanVidaMaxima.innerText);

        // 2. Calcula a porcentagem (Regra de 3 básica)
        let porcentagem = (atual / maximo) * 100;

        // 3. Trava o limite (Impede que a barra passe da caixa se o jogador ganhar vida temporária além do máximo, ou fique negativa)
        if (porcentagem > 100) porcentagem = 100;
        if (porcentagem < 0) porcentagem = 0;

        // 4. Aplica o resultado no estilo CSS da barra
        barra_vida.style.width = porcentagem + '%';
    });

    const manaAtual = document.getElementById('mana_atual');
    const spanManaMaxima = document.getElementById('mana_max');
    const barra_mana = document.getElementById('barra_mana');

    manaAtual.addEventListener('blur', () => {
        let atual = Number(manaAtual.value);
        let maximo = Number(spanManaMaxima.innerText);

        let porcentagem = (atual / maximo) * 100;

        if (porcentagem > 100) porcentagem = 100;
        if (porcentagem < 0) porcentagem = 0;

        barra_mana.style.width = porcentagem + '%';
    });

    vidaAtual.addEventListener('keydown', function(event) {
    if (event.key === 'Enter') {
        event.preventDefault(); // Evita enviar formulários ou quebrar linha
        vidaAtual.blur(); // Desseleciona o campo
    }
    });
    
    manaAtual.addEventListener('keydown', function(event) {
    if (event.key === 'Enter') {
        event.preventDefault(); // Evita enviar formulários ou quebrar linha
        manaAtual.blur(); // Desseleciona o campo
    }
    });
</script>
