<!DOCTYPE html>
<html lang="pt">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
        <title>{% block title %}Cyborg Gaming{% endblock %}</title>

        <!-- Bootstrap CDN (Essencial para o layout/estilo funcionar) -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

        <!-- CSS do Template Cyborg -->
        <link rel="stylesheet" href="{{ url_for('static', filename='css/fontawesome.css') }}">
        <link rel="stylesheet" href="{{ url_for('static', filename='css/templatemo-cyborg-gaming.css') }}">
        <link rel="stylesheet" href="{{ url_for('static', filename='css/owl.css') }}">
        <link rel="stylesheet" href="{{ url_for('static', filename='css/animate.css') }}">
        <link rel="stylesheet" href="{{ url_for('static', filename='css/flex-slider.css') }}">

        <!-- CSS Personalizado -->
        <link rel="stylesheet" href="{{ url_for('static', filename='css/paleta_personalizada.css') }}">

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400..900;1,400..900&family=Cinzel+Decorative:wght@400;700;900&family=Cinzel:wght@400..900&family=Uncial+Antiqua&display=swap" rel="stylesheet">
    </head>

    <body class="d-flex flex-column min-vh-100">
        <main class="flex-shrink-0 flex-grow-1">
            <!-- Inclui o Cabeçalho/Navegação -->
            {% include 'shared/nav.html' %}

            {% with messages = get_flashed_messages(with_categories=True) %}
                {% if messages %}
                    <div class="container px-5 pt-4">
                        {% for category, message in messages %}
                            <div class="alert alert-{{ 'danger' if category == 'error' else category }}" role="alert">
                                {{ message }}
                            </div>
                        {% endfor %}
                    </div>
                {% endif %}
            {% endwith %}

            <div class="container">
                <div class="row">
                    <div class="col-lg-12">
                        <div class="page-content">
                            {% block content %}
                            {% endblock %}
                        </div>
                    </div>
                </div>
            </div>
        </main>


        <!-- Inclui o Rodapé -->
        {% include 'shared/footer.html' %}
    </body>
    
    <!-- Scripts JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/isotope.min.js') }}"></script>
    <script src="{{ url_for('static', filename='js/owl-carousel.js') }}"></script>
    <script src="{{ url_for('static', filename='js/tabs.js') }}"></script>
    <script src="{{ url_for('static', filename='js/popup.js') }}"></script>
    <script src="{{ url_for('static', filename='js/custom.js') }}"></script>
</html>
